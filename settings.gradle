pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// foojay：让 build.gradle 的 java.toolchain 在缺 JDK 时自动下载（26.x 线目标 Java 25，
// 换机 / CI 环境 JDK 往往更旧）。
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'create_hand_made'
