plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// ------------------ Mixin 配置 ------------------
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// ------------------ 仓库配置 ------------------
repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
        }
    }

    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven { url = "https://maven.blamejared.com/" }
    mavenCentral()
    maven { url = "https://maven.aliyun.com/repository/public" }
}

// ------------------ SourceSets：女仆兼容独立隔离 ------------------
// ★ 目的：主代码回退/改动时，compat/tlm 下的代码不受影响
//   - 目录：src/tlmCompat/java
//   - 编译输出合并到同一个 jar
//   - 依赖方向：tlmCompat → main（单向）
sourceSets {
    tlmCompat {
        java.srcDir 'src/tlmCompat/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// ------------------ Forge 配置 ------------------
minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.tlmCompat
                }
            }
        }

        client2 {
            workingDirectory project.file('run2')
            args '--username', 'Dev2'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.tlmCompat
                }
            }
        }

        server {
            workingDirectory project.file('run')
            args '--nogui'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.tlmCompat
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '--mod', mod_id, '--all',
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath()

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.tlmCompat
                }
            }
        }
    }
}

// ------------------ 资源目录 ------------------
sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// ------------------ 依赖配置 ------------------
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create 本体
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    // Ponder 库
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    // Flywheel 渲染库
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    // Registrate 注册库
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))

    // JEI
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // ★ Cloth Config（可选依赖）
    //   - compileOnly：编译期可见，不打包进 jar
    //   - runtimeOnly：仅开发环境加载，方便本地调试配置界面，同样不进 jar
    //   - 玩家侧：安装了就显示配置界面，未安装则静默跳过
    compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
    runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")

    // KubeJS 的 Rhino 传递依赖
    compileOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")

    // KubeJS（可选依赖，不打包进 jar）
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")

    // ★ 车万女仆（可选依赖，隔离到 tlmCompat sourceSet）
    //   - 编译期：只给 tlmCompat 使用，主代码看不到
    //   - 运行期：加到全局 runtimeClasspath，让客户端能加载 TLM
    tlmCompatCompileOnly fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")
    runtimeOnly fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")

    // Mixin 注解处理器
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// ------------------ 编译顺序 ------------------
// tlmCompat 依赖 main 的输出，所以必须在 main 之后编译
tasks.named('compileTlmCompatJava') {
    dependsOn tasks.named('compileJava')
}

// ------------------ 元数据生成 ------------------
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            create_mod_version     : create_mod_version,
            jei_version            : jei_version,
            cloth_config_version   : cloth_config_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('compileJava') {
    dependsOn generateModMetadata
}

// ------------------ Jar 清单 ------------------
jar {
    // ★ 把 tlmCompat sourceSet 的输出合并到同一个 jar
    from sourceSets.tlmCompat.output

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_group_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_group_id
        ])
    }
}

// ------------------ 发布配置 ------------------
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}