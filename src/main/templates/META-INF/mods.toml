modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="alben,colin_101"
description='''
A Create addon for hand crafting.
'''
logoFile="mod_logo.png"

# 本模组已不再使用 Mixin（0.6.3 起移除最后一个注入类），因此没有 mixin 配置段。

# ==================== Forge 依赖 ====================
# ★ NeoForge → Forge
# ★ type="required" → mandatory=true
# ★ type="optional" → mandatory=false

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
mandatory=true
versionRange="[${create_mod_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[${jei_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
    modId="cloth_config"
    mandatory=false
    versionRange="[11.0.0,)"
    ordering="NONE"
    side="CLIENT"