org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 暂时关闭配置缓存，防止后续改配置时序列化报错
org.gradle.configuration-cache=false

# Parchment 映射
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

neo_version=21.1.250
# 发布环境用的版本（决定模组元数据里的最低要求）
neo_version_range=[21.1.0,)
loader_version_range=[1,)

## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=create_hand_made
# The human-readable display name for the mod.
mod_name=Create: Hand Made
mod_license=MIT
mod_version=0.3.0-beta
mod_group_id=com.alben.createhandmade

# Create 和附属依赖
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# 模组元数据依赖版本（不带构建号，用于游戏内检查）
create_mod_version=6.0.10

# JEI
# 开发环境锁 19.25+（KubeJS 2101.7.2-build.377 要求）；发布时的 versionRange 在 neoforge.mods.toml 里独立设置
jei_version=19.25.0.322

# KubeJS（Latvian maven: dev.latvian.mods:kubejs-neoforge）
kubejs_version=2101.7.2-build.377